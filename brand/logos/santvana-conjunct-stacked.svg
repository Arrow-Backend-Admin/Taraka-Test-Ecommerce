<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Sāntvana stacked lockup — conjunct न्त्व</title>
  <desc id="desc">Stacked lockup: tread mark above the Latin wordmark Sāntvana, with the Devanagari wordmark सान्त्वना below.</desc>
  <g fill="#1F1D1A">
    <rect x="244" y="150" width="112" height="112" rx="30" fill="none" stroke="#1F1D1A" stroke-width="3"/>
    <path d="M270 182h60M270 206h60M270 230h60" fill="none" stroke="#1F1D1A" stroke-width="9" stroke-linecap="round"/>
    <text x="300" y="350" text-anchor="middle" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-1.5">Sāntvana</text>
    <text x="300" y="430" text-anchor="middle" font-family="'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="48" font-weight="500">सान्त्वना</text>
  </g>
</svg>
