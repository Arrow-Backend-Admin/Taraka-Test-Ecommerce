<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Sāntvana — social template 4:5</title>
  <link rel="stylesheet" href="social.css">
</head>
<body>
  <main class="social-page">
    <div>
      <div class="board-wrap">
        <div class="board board--portrait board--dark">

            <p class="body">Free size exchange twice. 30-day returns from delivery.</p>
            <div class="rule"></div>

              <img class="logo" src="/brand/logos/santvana-horizontal-reverse.svg" alt="Sāntvana — horizontal bilingual lockup, reverse">
              <div class="footer-note">Sneakers, runners, everyday, sandals, boots.</div>
            </div>
          </div>
          <div class="tread"></div>
        </div>
      </div>
      <div class="caption">
        <strong>4:5 · 1080 × 1350</strong>
        <span>Concept template · not for print, domain or ad spend · logo 340 px wide</span>
      </div>
    </div>
  </main>
</body>
</html>
