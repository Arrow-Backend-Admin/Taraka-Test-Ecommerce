name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-sqlite:
    name: API tests (SQLite fast fallback)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
        env:
          APP_ENV: development
          ADMIN_API_TOKEN: test-admin-token
          MAIL_ENABLED: "false"
          RAZORPAY_MOCK: "true"
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret

  api-postgres:
    name: API tests (PostgreSQL 16, real database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santvana
          POSTGRES_PASSWORD: santvana
          POSTGRES_DB: santvana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santvana -d santvana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: development
      ADMIN_API_TOKEN: test-admin-token
      DATABASE_URL: postgresql+psycopg://santvana:santvana@localhost:5432/santvana_test
      TEST_DATABASE_URL: postgresql+psycopg://santvana:santvana@localhost:5432/santvana_test
      MAIL_ENABLED: "false"
      RAZORPAY_MOCK: "true"
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (parallel checkout, FTS and order races run on PostgreSQL)
        run: pytest
      - name: Migrations match models
        run: alembic upgrade head && alembic check
      - name: Seed catalogue
        run: python scripts/seed.py --no-dev-inventory
        env:
          APP_ENV: production
      - name: Launch check
        run: python scripts/launch_check.py
        env:
          APP_ENV: production

  catalogue-guards:
    name: Catalogue guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate catalogue
        run: python ../../brand/phase-3/validate_catalogue.py
        env:
          PYTHONIOENCODING: utf-8

  storefront:
    name: Storefront typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          APP_ENV: development
          PREVIEW_DRAFTS: "false"
