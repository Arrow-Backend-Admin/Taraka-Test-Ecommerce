name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-sqlite:
    name: API tests (SQLite fast fallback)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
        env:
          APP_ENV: development
          ADMIN_API_TOKEN: test-admin-token
          MAIL_ENABLED: "false"
          RAZORPAY_MOCK: "true"
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret

  api-postgres:
    name: API tests (PostgreSQL 16, real database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santvana
          POSTGRES_PASSWORD: santvana
          POSTGRES_DB: santvana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santvana -d santvana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: development
      ADMIN_API_TOKEN: test-admin-token
      DATABASE_URL: postgresql+psycopg://santvana:santvana@localhost:5432/santvana_test
      TEST_DATABASE_URL: postgresql+psycopg://santvana:santvana@localhost:5432/santvana_test
      MAIL_ENABLED: "true"
      MAILPIT_URL: http://localhost:8025
      MAILPIT_SMTP_HOST: localhost
      MAILPIT_SMTP_PORT: "1025"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      RAZORPAY_MOCK: "true"
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8025/api/v1/info >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Mailpit did not become ready" >&2
          exit 1
      - name: Test (parallel checkout, FTS, orders, mail and restore)
        run: pytest
      - name: Migrations upgrade, downgrade, upgrade
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Seed catalogue
        run: python scripts/seed.py --no-dev-inventory
        env:
          APP_ENV: production
          MAIL_ENABLED: "false"
          RAZORPAY_MOCK: "false"
      - name: Launch check
        run: python scripts/launch_check.py
        env:
          APP_ENV: production
          MAIL_ENABLED: "false"
          RAZORPAY_MOCK: "false"

  catalogue-guards:
    name: Catalogue guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate catalogue
        run: python ../../brand/phase-3/validate_catalogue.py
        env:
          PYTHONIOENCODING: utf-8

  storefront:
    name: Storefront typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          APP_ENV: development
          PREVIEW_DRAFTS: "false"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  dependency-audit:
    name: Dependency audit (pip-audit and npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          pip install -e ".[dev]"
          pip install pip-audit
      - name: pip-audit
        run: pip-audit
      - name: npm ci
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  schemathesis:
    name: OpenAPI fuzzing (schemathesis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: development
      ADMIN_API_TOKEN: test-admin-token
      DATABASE_URL: sqlite:///./schemathesis.db
      MAIL_ENABLED: "false"
      RAZORPAY_MOCK: "true"
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Prepare database
        run: |
          alembic upgrade head
          python scripts/seed.py
      - name: Fuzz every documented endpoint (no 5xx allowed)
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > uvicorn-schemathesis.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then break; fi
            sleep 1
          done
          schemathesis run http://127.0.0.1:8000/openapi.json \
            --checks not_a_server_error \
            --hypothesis-max-examples=15 \
            --max-response-time=5000 \
            --workers=1
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-server-log
          path: apps/api/uvicorn-schemathesis.log

  storefront-e2e:
    name: Storefront E2E, axe and Lighthouse
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      ADMIN_API_TOKEN: e2e-admin-token
      DATABASE_URL: sqlite:///./e2e.db
      RAZORPAY_MOCK: "true"
      RAZORPAY_KEY_ID: rzp_test_mock
      RAZORPAY_KEY_SECRET: test-key-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      MAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Prepare seeded database
        working-directory: apps/api
        run: |
          alembic upgrade head
          python scripts/seed.py
      - name: Install storefront
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright (mobile viewport, 3G, axe)
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
      - name: Lighthouse budgets
        run: |
          (cd apps/api && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api-lighthouse.log 2>&1 &)
          npm run dev --workspace @santvana/storefront > /tmp/web-lighthouse.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID 2>/dev/null || true' EXIT
          npx --yes wait-on@8 http://127.0.0.1:8000/health/live http://127.0.0.1:3000/catalogue
          npm run lighthouse
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          PREVIEW_DRAFTS: "true"
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
